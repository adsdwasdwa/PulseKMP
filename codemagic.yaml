workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "app.pulsefit"
      java: 17
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: |
          ./gradlew :composeApp:assembleDebug
      - name: Build Android Release Bundle (AAB)
        script: |
          ./gradlew :composeApp:bundleRelease
      - name: Run Android Unit Tests
        script: |
          ./gradlew :composeApp:testDebugUnitTest
    artifacts:
      - composeApp/build/outputs/apk/**/*.apk
      - composeApp/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS Framework Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      java: 17
      xcode: latest
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      scripts:
        - name: Make gradlew executable
          script: chmod +x gradlew
        - name: Build iOS Framework (Release)
          script: |
            ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
    artifacts:
      - composeApp/build/bin/iosArm64/releaseFramework/*.framework/**
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true

  desktop-workflow:
    name: Desktop Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Build Desktop Distribution
        script: |
          ./gradlew :composeApp:packageDistributionForCurrentOS
    artifacts:
      - composeApp/build/compose/binaries/main/**/*.dmg
      - composeApp/build/compose/binaries/main/**/*.deb
      - composeApp/build/compose/binaries/main/**/*.msi
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
