workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play # For publishing, if needed
      vars:
        PACKAGE_NAME: "app.pulsefit"
      java: 17
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android Debug APK
        script: |
          ./gradlew :composeApp:assembleDebug
      - name: Run Unit Tests
        script: |
          ./gradlew test
    artifacts:
      - composeApp/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients:
          - user@example.com # Update with your email
        notify:
          success: true
          failure: true

  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials # For signing and publishing
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcworkspace" # Update path if different
        XCODE_SCHEME: "iosApp"
      java: 17
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Build iOS Framework
        script: |
          ./gradlew :composeApp:assemblePulseKMPReleaseFrameworkIosArm64
      - name: Build iOS App (requires XCode project)
        script: |
          # If you have an iosApp directory with an Xcode project:
          # xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release -archivePath "$XCODE_SCHEME.xcarchive" archive
          # xcodebuild -exportArchive -archivePath "$XCODE_SCHEME.xcarchive" -exportOptionsPlist export_options.plist -exportPath .
          echo "iOS app build script goes here once Xcode project is set up."
    artifacts:
      - composeApp/build/fat-framework/release/*.framework
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: true
